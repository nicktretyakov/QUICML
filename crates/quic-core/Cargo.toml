[package]
name = "quic-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "From-scratch QUIC (RFC 9000) transport primitives, streams, loss detection and congestion control on tokio + std::net::UdpSocket."
repository.workspace = true

[features]
default = ["rustls-ring", "std"]
std = []
# TLS provider for the QUIC handshake. We use rustls with the ring crypto
# provider by default; aws-lc-rs can be enabled for AWS-validated FIPS builds.
rustls-ring = ["rustls/ring"]
rustls-aws-lc-rs = ["rustls/aws_lc_rs"]
# Tracing of every inbound/outbound packet (verbose).
trace-packets = []

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
ring = { workspace = true }
# AES single-block ECB used only for QUIC header protection mask (RFC 9001 §5.4).
aes = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
rand = { workspace = true }
slab = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
crc = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
webpki-roots = { workspace = true }
